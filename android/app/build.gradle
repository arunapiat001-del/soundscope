plugins { id 'com.android.application' }
android {
    namespace 'com.soundscope.app'
    compileSdk 35
    defaultConfig { applicationId 'com.soundscope.app'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/webAssets') } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.register('copyWebAssets', Copy) { from '../../web'; into layout.buildDirectory.dir('generated/webAssets/web') }
tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
